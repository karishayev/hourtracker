<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hour Tracker & Planner</title>
    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-color: #f3f4f6;
        --card-bg: #ffffff;
        --text-color: #1f2937;
        --border-color: #e5e7eb;
        --danger: #ef4444;
        --success: #10b981;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 450px;
        background: var(--card-bg);
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        box-sizing: border-box;
        margin: 20px;
      }

      h2 {
        margin-top: 0;
        color: var(--text-color);
        font-size: 24px;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 15px;
        text-align: left;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: var(--primary);
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
      }

      button:hover {
        background-color: var(--primary-hover);
      }

      .secondary-btn {
        background-color: #6b7280;
      }
      .secondary-btn:hover {
        background-color: #4b5563;
      }

      .error-msg {
        color: var(--danger);
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
      }

      .success-msg {
        color: var(--success);
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
      }

      /* Стилі для кабінету */
      .dashboard {
        display: none;
      }

      .today-card {
        background: #eef2ff;
        border-left: 4px solid var(--primary);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: left;
      }

      .today-card h3 {
        margin: 0 0 8px 0;
        color: var(--primary);
        font-size: 16px;
      }

      .today-card p {
        margin: 4px 0;
        font-size: 14px;
      }

      .stats {
        display: flex;
        justify-content: space-between;
        background: #f9fafb;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .logout-btn {
        background-color: var(--danger);
        margin-top: 20px;
      }
      .logout-btn:hover {
        background-color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- ВХІД / РЕЄСТРАЦІЯ -->
      <div id="auth-section">
        <h2 id="form-title">Вхід в систему</h2>
        <div class="input-group">
          <label>Ім'я користувача</label>
          <input type="text" id="username" placeholder="Введіть логін" />
        </div>
        <div class="input-group">
          <label>Пароль</label>
          <input type="password" id="password" placeholder="Введіть пароль" />
        </div>
        <button onclick="handleAuth()">Увійти</button>
        <button class="secondary-btn" onclick="toggleAuthMode()">
          Створити акаунт
        </button>
        <div id="message" class="error-msg"></div>
      </div>

      <!-- ГОЛОВНИЙ КАБІНЕТ -->
      <div id="dashboard-section" class="dashboard">
        <h2>Вітаю, <span id="user-display"></span>! 👋</h2>

        <!-- Блок сьогоднішнього дня (план/графік/нотатка) -->
        <div class="today-card">
          <h3>📅 План на сьогодні (<span id="current-date-str"></span>)</h3>
          <p>
            <strong>Графік:</strong>
            <span id="today-schedule">Ще не задано в календарі</span>
          </p>
          <p>
            <strong>Нотатка:</strong>
            <span id="today-note">Немає нотаток на сьогодні</span>
          </p>
        </div>

        <div class="stats">
          <span>Ставка: <strong id="rate-display">0</strong> грн/год</span>
          <span>Заробіток: <strong id="earned-display">0</strong> грн</span>
        </div>

        <div class="input-group">
          <label>Поточна ставка (грн/год)</label>
          <input
            type="number"
            id="rate-input"
            placeholder="Введіть ставку"
            oninput="updateData()"
          />
        </div>

        <div class="input-group">
          <label>Фактично відпрацьовані години за сьогодні</label>
          <input
            type="number"
            id="hours-input"
            placeholder="Наприклад: 8"
            oninput="updateData()"
          />
        </div>

        <div id="save-status" class="success-msg"></div>

        <button class="logout-btn" onclick="logout()">Вийти з акаунта</button>
      </div>
    </div>

    <script>
      let isRegisterMode = false;
      let currentUser = null;
      let userData = { rate: 0, logs: [] };

      function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById("form-title").innerText = isRegisterMode
          ? "Створити акаунт"
          : "Вхід в систему";
        document.querySelector('button[onclick="handleAuth()"]').innerText =
          isRegisterMode ? "Зареєструватися" : "Увійти";
        document.querySelector(".secondary-btn").innerText = isRegisterMode
          ? "Маю акаунт"
          : "Створити акаунт";
        document.getElementById("message").innerText = "";
      }

      async function handleAuth() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const msgEl = document.getElementById("message");

        if (!username || !password) {
          msgEl.innerText = "Заповніть усі поля!";
          return;
        }

        const endpoint = isRegisterMode ? "/api/register" : "/api/login";

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await response.json();

          if (data.success) {
            currentUser = username;
            userData = data.user || { rate: 0, logs: [] };
            showDashboard();
          } else {
            msgEl.innerText = data.message || "Сталася помилка";
          }
        } catch (err) {
          msgEl.innerText = "Помилка зв'язку з сервером.";
        }
      }

      function showDashboard() {
        document.getElementById("auth-section").style.display = "none";
        document.getElementById("dashboard-section").style.display = "block";
        document.getElementById("user-display").innerText = currentUser;

        document.getElementById("rate-input").value = userData.rate || "";

        // Заповнення сьогоднішніх даних
        const todayStr = new Date().toISOString().split("T")[0];
        document.getElementById("current-date-str").innerText = todayStr;

        const todayLog = userData.logs.find((l) => l.date === todayStr);
        if (todayLog) {
          document.getElementById("today-schedule").innerText =
            todayLog.schedule || "Не вказано";
          document.getElementById("today-note").innerText =
            todayLog.note || "Немає нотаток";
          document.getElementById("hours-input").value = todayLog.h || "";
        }

        calculateEarnings();
      }

      async function updateData() {
        const rate =
          parseFloat(document.getElementById("rate-input").value) || 0;
        const hours =
          parseFloat(document.getElementById("hours-input").value) || 0;
        const todayStr = new Date().toISOString().split("T")[0];

        userData.rate = rate;

        // Оновлюємо або додаємо сьогоднішній лог
        let todayLog = userData.logs.find((l) => l.date === todayStr);
        if (todayLog) {
          todayLog.h = hours;
        } else {
          userData.logs.push({
            date: todayStr,
            schedule: "",
            h: hours,
            note: "",
          });
        }

        calculateEarnings();

        // Відправляємо на сервер
        try {
          await fetch("/api/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: currentUser,
              rate: userData.rate,
              logs: userData.logs,
            }),
          });
          const statusEl = document.getElementById("save-status");
          statusEl.innerText = "Збережено ✓";
          setTimeout(() => {
            statusEl.innerText = "";
          }, 1500);
        } catch (err) {
          console.error("Помилка збереження");
        }
      }

      function calculateEarnings() {
        const rate = userData.rate || 0;
        const totalHours = userData.logs.reduce(
          (sum, l) => sum + (l.h || 0),
          0
        );
        document.getElementById("rate-display").innerText = rate;
        document.getElementById("earned-display").innerText = (
          totalHours * rate
        ).toFixed(2);
      }

      function logout() {
        currentUser = null;
        userData = { rate: 0, logs: [] };
        document.getElementById("dashboard-section").style.display = "none";
        document.getElementById("auth-section").style.display = "block";
        document.getElementById("password").value = "";
      }
    </script>
  </body>
</html>
